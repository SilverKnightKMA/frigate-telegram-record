# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#package-ecosystem-
version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - "automated"
      - "dependencies"
      - "github-actions"
    assignees:
      - "SilverKnightKMA"
    open-pull-requests-limit: 5

  # Main Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - "automated"
      - "dependencies"
      - "docker"
    assignees:
      - "SilverKnightKMA"
    open-pull-requests-limit: 3

  # Web Dashboard Dockerfile
  - package-ecosystem: docker
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    labels:
      - "automated"
      - "dependencies"
      - "docker"
      - "web-dashboard"
    assignees:
      - "SilverKnightKMA"
    open-pull-requests-limit: 3

  # Python dependencies for web dashboard
  - package-ecosystem: pip
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    labels:
      - "automated"
      - "dependencies"
      - "python"
      - "web-dashboard"
    assignees:
      - "SilverKnightKMA"
    open-pull-requests-limit: 5
    # Allow both direct and indirect updates
    allow:
      - dependency-type: "all"

  - package-ecosystem: docker-compose	
    directory: "/"
    schedule:
      interval: daily
    labels:
      - "automated"
      - "dependencies"
    assignees:
      - "SilverKnightKMA"
