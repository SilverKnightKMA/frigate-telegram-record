services:
  frigate-telegram-record:
    image: ghcr.io/silverknightkma/frigate-telegram-record:1.0.3
    container_name: frigate-telegram-record
    restart: unless-stopped
    tmpfs:
      - /dev/shm:rw,size=512m
    volumes:
      - ./data:/app/data
      - ./config.env:/app/config/config.env:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Ho_Chi_Minh
      
      - FRIGATE_HOST=http://your-frigate-host:5000
      - TELEGRAM_API_URL=https://api.telegram.org
      - BOT_TOKEN=YOUR_BOT_TOKEN_HERE

      - CAMERAS=Cam1|cam1|THREAD_ID|CHAT_ID;Cam2|cam2|THREAD_ID|CHAT_ID
      - ERROR_CHAT_ID=YOUR_ERROR_CHAT_ID
      - ERROR_THREAD_ID=YOUR_ERROR_THREAD_ID

      - RETENTION_DAYS=30
      - ALERT_RETENTION_HOURS=72
      - ALERT_REPEAT=false
      - LOOKBACK_HOURS=24
      
      - MAX_CONCURRENT_TASKS=5
      - PADDING_SEC=5
      - MAX_RETRIES=5
      
      - REC_DURATION_MIN=15
      - TEST_REC_DURATION_MIN=1
      - MODE=record
      - NOTIFY_ON_RECOVERY=true
